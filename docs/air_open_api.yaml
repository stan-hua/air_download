openapi: 3.0.2
info:
  title: 'AIR: The Automated Image Retrieval Portal'
  description: "## API for working with the AIR portal\n\
    This document describes the web API for querying for and retrieving DICOM images \
    via the AIR portal. The API is specified using the [OpenAPI Specification (OAS)](https://www.openapis.org/) v3.0.3. \
    For more information about OAS see: [http://spec.openapis.org/oas/v3.0.3](http://spec.openapis.org/oas/v3.0.3). \n\
    \n---\n\n\
    ### Usage\n\n\
    This section describes how to test out the API using this demo page.  \
    For a sample client using Python please see: [https://github.com/rauschecker-sugrue-labs/air_download](https://github.com/rauschecker-sugrue-labs/air_download). \
    You can also use the OpenAPI generator tool to create a client in your preferred language: [https://github.com/OpenAPITools/openapi-generator](https://github.com/OpenAPITools/openapi-generator)\n\
    #### Authentication\n\n\
    All API calls require the use of a HTTP Bearer token.  To obtain the token start by using the `/login` API call to authenticate.  \
    When you get back a sucessful login response, the token will be in the `jwt` key: \n\n\
    > ``` \n\
    > { \n\
    > \t\"successful\": true,\n\
    > \t\"sources\": [\n\
    > \t\t{\n\
    > \t\t\t\"name\": \"PACS\"\n\
    > \t\t\t\"id\": 1\n\
    > \t\t}\n\
    > \t],\n\
    > \t.\n\
    > \t.\n\
    > \t.\n\
    > \t\"token\": {\n\
    > \t\t\"jwt\": \"eyJraWQiOiIxNDkyNzI3ODE4MDc1IiwiYWxnIjoiUlMyNTYifQ...\"\n\
    > \t}\n\
    > } \n\
    > ``` \n\
    Once you have your token click the **Authorize** button and enter it when prompted. \
    Your token will now be used for all subsequent requests.\n\n\
    #### Obtaining Study Metadata ####\n\n\
    Once you have your token configured you will next need to query for the metadata of the study you want to download.  \
    To begin use the `/secure/search/query-data-source` API call to find the study of interest.  \
    You will need to set the `sourceId` in the request to the id of one of the sources from the login response.  \
    While the query API accepts a variety of different parameters, it is recommended you use an \
    accession number you know is on PACS to test the API.  The query will return a result object \
    containing an array of matching studies in the `exams` key: \n\n\
    > ``` \n\
    > { \n\
    > \t\"successful\": true,\n\
    > \t.\n\
    > \t.\n\
    > \t.\n\
    > \t\"exams\": [\n\
    > \t\t{\n\
    > \t\t\t\"patientName\": \"TEST, PATIENT\",\n\
    > \t\t\t\"patientId\": \"01234561\",\n\
    > \t\t\t\"birthdate\": \"2020-10-20\",\n\
    > \t\t\t\"sex\": \"M\",\n\
    > \t\t\t\"accessionNumber\": \"1234567\",\n\
    > \t\t\t\"dateTime\": \"2017-04-20T13:58:25.000-07:00\",\n\
    > \t\t\t\"description\": \"XR CHEST 1 VIEW AP\",\n\
    > \t\t\t\"modality\": \"CR\",\n\
    > \t\t\t\"imageCount\": 4,\n\
    > \t\t\t\"studyUid\": \"1.2.3.4\",\n\
    > \t\t\t\"deviceId\": 0,\n\
    > \t\t\t\"viewable\": true,\n\
    > \t\t\t\"online\": true\n\
    > \t\t}\n\
    > \t]\n\
    > } \n\
    > ``` \n\
    Once you have identified the study you want to retrieve you will need to query \
    for the associated series using the `/secure/search/series` API call.  Simply pass \
    the selected study object as the request:\n\n\
    > ``` \n\
    > {\n\
    > \t\"patientName\": \"TEST, PATIENT\",\n\
    > \t\"patientId\": \"01234561\",\n\
    > \t\"birthdate\": \"2020-10-20\",\n\
    > \t\"sex\": \"M\",\n\
    > \t\"accessionNumber\": \"1234567\",\n\
    > \t\"dateTime\": \"2017-04-20T13:58:25.000-07:00\",\n\
    > \t\"description\": \"XR CHEST 1 VIEW AP\",\n\
    > \t\"modality\": \"CR\",\n\
    > \t\"imageCount\": 4,\n\
    > \t\"studyUid\": \"1.2.3.4\",\n\
    > \t\"deviceId\": 0,\n\
    > \t\"viewable\": true,\n\
    > \t\"online\": true\n\
    > }\n\
    > ``` \n\
    and you will receive back an array containing all the series within that study:\n\n\
    > ``` \n\
    > [\n\
    > \t{\n\
    > \t\t\"description\": \"AP\",\n\
    > \t\t\"imageCount\": 2,\n\
    > \t\t\"modality\": \"DX\",\n\
    > \t\t\"seriesNumber\": \"001\",\n\
    > \t\t\"seriesUid\": \"1.2.3.4\"\n\
    > \t},\n\    
    > \t{\n\
    > \t\t\"description\": \"Lateral\",\n\
    > \t\t\"imageCount\": 2,\n\
    > \t\t\"modality\": \"DX\",\n\
    > \t\t\"seriesNumber\": \"002\",\n\
    > \t\t\"seriesUid\": \"5.6.7.8\"\n\
    > \t}\n\
    > ]\n\
    > ``` \n\
    You now have all the necessary meta-data to continue to the process of retrieval. \n\n\
    #### Downloading Images ####\n\
    Since the retrieval of images from the backend datasources is asynchronous, the AIR \
    portal API uses a polling mechanism to allow clients to queue images for \
    retrieval and to be notified when they are ready to download. \ 
    The process begins with the `/secure/search/download/start` API call, which \
    takes a request object as its parameter:\n\n\
    > ``` \n\
    > {\n\
    > \t\"projectId\": -1,\n\
    > \t\"profileId\": -1,\n\
    > \t\"decompress\": false,\n\
    > \t\"includeLog\": false,\n\
    > \t\"study\": {\n\
    > \t\t\"patientId\": \"01234561\",\n\
    > \t\t\"accessionNumber\": \"1234567\",\n\
    > \t\t\"studyUid\": \"1.2.3.4\",\n\
    > \t\t\"deviceId\": 10\n\
    > \t},\n\
    > \t\"series\": [\n\
    > \t\t{\n\
    > \t\t\"seriesUid\": \"1.2.3.4.5\"\n\
    > \t\t},\n\
    > \t\t{\n\
    > \t\t\"seriesUid\": \"5.6.7.8\"\n\
    > \t\t}\n\
    > \t]\n\
    > }\n\
    > ``` \n\
    The study and series attributes are populated using the metadata obtained above. \
    *Note: You do not need to download all series.  You can choose to only include \
    the UIDs of the series you're interested in downloading. \
    Downloading only the series you need can significantly reduce the amount of data \
    that needs to be retrieved and will speed up the download process.* \
    The `start` API call will queue the request and return a response containing the download id:\n\n\
    > ``` \n\
    > {\n\
    > \t\"downloadId\": 123456,\n\
    > \t\"status\": \"pending\"\n\
    > }\n\
    > ``` \n\
    Clients should then use the `/secure/search/download/check` API call to periodically check \
    (*recommended interval is 10 secs*) the status of their request using the download id obtained above. \
    When the status returned is **started** or **completed** it means there are images available \
    for download and the client should proceed with calling the `/secure/search/download/zip` method \
    to start downloading the images in a ZIP archive. \n\
    \n---\n\n\
    "
  contact:
    email: air-support-ext@ucsf.edu
    name: AIR Application Support

  license:
    name: Copyright UC Regents

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "air_download"
version = "0.3.0"
description = "Command line interface to the Automated Image Retrieval (AIR) Portal. Originally developed by John Colby."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Pierre Nedelec"},
]
dependencies = [
    "requests>=2.28",
    "python-dotenv>=0.19",
    "tqdm>=4.60",
    "fire>=0.5",
    "pylibjpeg[libjpeg]>=2.1.0,<3",
    "ultraml>=0.2.0",
    # Letterboxing rescales every ultrasound frame, so cv2 is a direct
    # import now, not just ultraml's business. Named here rather than as a
    # conda dependency because ultraml pulls the PyPI wheel regardless, and
    # conda-forge's py-opencv would only be overwritten by it.
    "opencv-python-headless>=4.9",
]

[project.urls]
Repository = "https://github.com/stan-hua/air_download"

[project.scripts]
air_download = "air_download.cli:cli"
air_match = "air_download.us_ct.match:cli"
air_cohort = "air_download.us_ct.cohort:cli"
air_frames = "air_download.frames:cli"
air_convert = "air_download.us_ct.convert:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

# State the package explicitly. Downloads land in a directory in the working
# tree, and flat-layout auto-discovery would take one (e.g. cohort/) for a
# second top-level package and refuse to build.
[tool.setuptools.packages.find]
include = ["air_download*"]

# ---------------------------------------------------------------------------
# pixi (the only supported package manager for this project)
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

# Runtime dependencies resolved from conda-forge rather than PyPI.
# Keep the version bounds in sync with [project.dependencies], which remains
# authoritative for anyone installing the built wheel.
[tool.pixi.dependencies]
python = ">=3.10"
requests = ">=2.28"
python-dotenv = ">=0.19"
tqdm = ">=4.60"
fire = ">=0.5"
pandas = ">=3.0.5,<4"
openpyxl = ">=3.1.5,<4"
matplotlib = ">=3.11.1,<4"
seaborn = ">=0.13.2,<0.14"
numpy = ">=2.5.1,<3"
pydicom = ">=3.0.2,<4"
nibabel = ">=5.4.2,<6"
zarr = ">=3.3.0,<4"
numcodecs = ">=0.16.5,<0.17"

# Installs the package itself (and its `air_download` console script) in
# editable mode, so source edits take effect without a reinstall.
[tool.pixi.pypi-dependencies]
air_download = { path = ".", editable = true }

# `dev` is auto-derived from [project.optional-dependencies]; folding it into
# `default` keeps a single environment holding all necessary requirements.
[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }

# Tasks mirror the workflows documented in README.md. pixi appends any
# trailing arguments, so `pixi run search --mrn 12345 -c ~/air_login.txt`
# runs `air_download --search-only --mrn 12345 -c ~/air_login.txt`.
[tool.pixi.tasks]
download = { cmd = "air_download", description = "Download exams by accession or --mrn" }
search = { cmd = "air_download --search-only", description = "List matching exams without downloading" }
list-projects = { cmd = "air_download -lpj", description = "List available project IDs" }
list-profiles = { cmd = "air_download -lpf", description = "List available anonymization profiles" }
match = { cmd = "air_match", description = "Match ED ultrasound exams to the CTs that followed" }
download-cohort = { cmd = "air_cohort", description = "Download a matched US-CT cohort into per-patient visit folders" }
frames = { cmd = "air_frames", description = "Count frames in downloaded DICOMs, and prune to the multi-frame clips" }
convert = { cmd = "air_convert", description = "Convert a downloaded cohort into NIfTI volumes and Zarr clips" }
test = { cmd = "pytest", description = "Run the test suite" }
